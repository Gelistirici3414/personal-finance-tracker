{% extends "base.html" %}
{% block title %}Yeni Borç/Alacak{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Yeni Borç/Alacak Ekle</h2>
<form method="POST" class="bg-gray-800 p-6 rounded shadow max-w-md">
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">Başlık</label>
        <input type="text" name="title" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">Miktar</label>
        <input type="number" step="0.01" name="amount" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">Son Tarih</label>
        <input type="date" name="due_date" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">Kategori</label>
        <input type="text" name="category" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded">Kaydet</button>
    <a href="{{ url_for('debts.list_debts') }}" class="block text-center mt-2 text-gray-400 hover:text-white">İptal</a>
</form>
{% endblock %}
