{% extends "base.html" %}
{% block title %}Şifre Sıfırla - Kişisel Finans Takip{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-white mb-2">Yeni Şifre Belirle</h1>
        <p class="text-gray-400 text-center mb-6">Parolanızın yerini alacak yeni şifrenizi seçin.</p>

        {% if error %}
        <div class="bg-red-900/40 border border-red-600 text-red-200 text-sm rounded p-3 mb-4">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
            <div>
                <label class="block text-gray-300 mb-1">Yeni Şifre</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <div>
                <label class="block text-gray-300 mb-1">Yeni Şifre (Tekrar)</label>
                <input type="password" name="confirm" required minlength="6"
                       class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold">Şifreyi Güncelle</button>
        </form>
    </div>
</div>
{% endblock %}
