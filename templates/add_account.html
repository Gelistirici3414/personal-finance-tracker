{% extends "base.html" %}
{% block title %}Hesap Ekle{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Yeni Hesap Ekle</h2>
<form method="POST" class="bg-gray-800 p-6 rounded shadow max-w-md">
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">İsim</label>
        <input type="text" name="name" required class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">Tür</label>
        <select name="type" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="Bank">Banka</option>
            <option value="Cash">Nakit</option>
            <option value="CreditCard">Kredi Kartı</option>
            <option value="Other">Diğer</option>
        </select>
    </div>
    <div class="mb-4">
        <label class="block text-gray-300 mb-1">Başlangıç Bakiyesi</label>
        <input type="number" step="0.01" name="initial_balance" value="0" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded">Kaydet</button>
    <a href="{{ url_for('accounts.list_accounts') }}" class="block text-center mt-2 text-gray-400 hover:text-white">İptal</a>
</form>
{% endblock %}
